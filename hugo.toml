baseURL = "https://shaoyanji.github.io/hub/"
title = "Shaoyan Ji"
languageCode = "en"
enableRobotsTXT = true
enableGitInfo = false

[params]
  description = "An index of the writing and the things I build, kept in one place."
  author = "Shaoyan Ji"
  # Feeds are read at build time so the index cannot go stale while the sources
  # keep publishing. A feed that is down renders as an empty section, not an error.
  feeds = [
    { name = "mataroa", label = "mataroa", url = "https://jisifu.mataroa.blog/rss/" },
  ]
  projectsUser = "shaoyanji"
  projectsLimit = 9

[menus]
  [[menus.main]]
    name = "about"
    url = "/about/"
    weight = 10

[markup]
  [markup.goldmark.renderer]
    unsafe = false
  [markup.highlight]
    noClasses = false

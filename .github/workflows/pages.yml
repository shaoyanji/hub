name: pages

# Pages serves the `gh-pages` branch, so this job builds the site and publishes
# the rendered output there. The artifact-based deploy-pages path was tried
# first and refused: the site was created by API with a source branch that did
# not exist (`master`), and every deploy job failed against it. A branch Pages
# already owns is one fewer moving part.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.147.0"
          extended: true
      - name: Build
        run: hugo --minify --baseURL "https://shaoyanji.github.io/hub/"
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true

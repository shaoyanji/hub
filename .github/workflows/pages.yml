name: pages

# Pages serves the `gh-pages` branch, so this job builds the site and publishes
# the rendered output there. The build is `nix build .#site` (nixstix); the two
# live sources are read first, because a Nix build reads no network.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Read the live sources
        run: python3 scripts/fetch-data.py
      - name: Build
        run: nix build .#site --print-out-paths
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./result
          publish_branch: gh-pages
          force_orphan: true
